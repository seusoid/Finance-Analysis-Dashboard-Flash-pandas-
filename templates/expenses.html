{% extends "base.html" %}
{% block content %}

<h2 class="mb-4">All Expenses</h2>

<table class="table table-bordered table-striped">
    <thead>
        <tr>
            <th>Date</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Description</th>
            <th>Payment</th>
        </tr>
    </thead>
    <tbody>
        {% for e in expenses %}
        <tr>
            <td>{{ e.date }}</td>
            <td>{{ e.category.name }}</td>
            <td>{{ e.amount }}</td>
            <td>{{ e.description }}</td>
            <td>{{ e.payment_method }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
