{% extends "base.html" %}
{% block content %}

<h2 class="mb-4">Spending Analytics</h2>

<div class="row">

    <div class="col-md-6 mb-4">
        <div class="card p-3 shadow-sm">
            <h5>Category Breakdown</h5>
            <img src="{{ category_chart }}" class="img-fluid">
        </div>
    </div>

    <div class="col-md-6 mb-4">
        <div class="card p-3 shadow-sm">
            <h5>Monthly Trends</h5>
            <img src="{{ monthly_chart }}" class="img-fluid">
        </div>
    </div>

    <div class="col-md-12 mb-4">
        <div class="card p-3 shadow-sm">
            <h5>Budget vs Actual</h5>
            {% if budget_chart %}
            <img src="{{ budget_chart }}" class="img-fluid">
            {% else %}
            <p>No budget data available</p>
            {% endif %}
        </div>
    </div>

</div>

{% endblock %}
